    <main>
        <div class="task-blocks">
            <div class="task">
                <h2>Task 5 | Add & Remove Methods</h2>
                <p id="text-visibility">Get me some candies</p>
                <ul id="list"></ul>
                <button id="btn-append">Add Item via append</button>
                <button id="btn-prepend">Add Item via prepend</button>
                <button id="btn-remove">Remove Item</button>
            </div>
            
            <div class="task">
                <h2>Task 6 | Modifying Attributes</h2>
                <img src="https://i.pinimg.com/474x/81/42/11/814211f7273adb1f37eb8ac202ded657.jpg" alt="please" width="250px" id ="image">

                    <button id="btn-image">Change Image</button>
                    <button id="btn-link">Change Link</button>
                </div>
                
            </div>

            <div class="task">
                <h2>Task 7 | Form Interaction</h2>
                <input type="text" id="input-text" placeholder="Enter your name">
                <input type="email" id="input-email" placeholder="Enter your email">
                <p>Your name is: <span id="output-name"></span></p>
                <p>Your email is: <span id="output-email"></span></p>
        </div>
